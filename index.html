/* ===== SPIN CONTROL PANEL ===== */
.spin-config{margin-top:12px;padding:14px;border:1px solid #ffffff1c;border-radius:22px;background:linear-gradient(145deg,#21152eaa,#100d18dd);box-shadow:inset 0 1px #ffffff12}
.spin-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;text-align:left}
.spin-head b{font-size:14px;letter-spacing:.01em}
.spin-cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.spin-cat{display:grid;grid-template-columns:27px 1fr;grid-template-rows:auto auto;align-items:center;gap:0 7px;text-align:left;padding:10px;border:1px solid #ffffff18;border-radius:14px;background:#ffffff08;color:var(--txt);font:inherit;cursor:pointer}
.spin-cat span{grid-row:1/3;display:grid;place-items:center;width:27px;height:27px;border-radius:9px;background:#8b5cf622;color:#d6b8ff;font-size:19px}
.spin-cat b{font-size:12px}.spin-cat small{font-size:10px;color:var(--mut)}
.spin-cat.on{border-color:#b17aff;background:#8b5cf622;box-shadow:0 0 14px #8b5cf622}
.spin-rarities{display:flex;flex-wrap:wrap;gap:6px}
.spin-rar{display:flex;align-items:center;gap:6px;padding:8px 9px;border:1px solid #ffffff18;border-radius:999px;background:#ffffff08;color:#ddd;font:700 11px Manrope;cursor:pointer}
.spin-rar i{width:8px;height:8px;border-radius:50%;background:var(--rc);box-shadow:0 0 8px var(--rc)}
.spin-rar.on{border-color:var(--rc);background:color-mix(in srgb,var(--rc) 17%,#17121f);color:#fff}
.spin-rar b{color:var(--rc)}
.spin-count{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.spin-mult{padding:10px 5px;border:1px solid #ffffff18;border-radius:14px;background:#ffffff08;color:#ddd;font:inherit;cursor:pointer}
.spin-mult b{display:block;font-size:17px}.spin-mult small{display:block;margin-top:3px;color:var(--mut);font-size:10px}
.spin-mult.on{border-color:#b17aff;background:linear-gradient(145deg,#8b5cf633,#ec3b861c);box-shadow:0 0 14px #8b5cf622}
.spin-hint{margin-top:9px;text-align:center;font-size:11px}.spin-hint b{color:#d6b8ff}

/* ===== WARDROBE 2.0 ===== */
.ward-hero{position:relative;overflow:hidden;padding:17px;border:1px solid #9b75e955;border-radius:24px;background:radial-gradient(circle at 90% 0%,#8b5cf633,transparent 42%),linear-gradient(145deg,#211532,#100b18);margin-bottom:12px}

async function serverCreateAuction(x){if(!S.pendingListings||typeof S.pendingListings!=='object')S.pendingListings={};const key=S.pendingListings[x.u]||uid();S.pendingListings[x.u]=key;save();try{const price=Math.floor(Number($('#sp')?.value));const durationHours=Number($('#dur')?.value);const r=await window.feServerRequest('create_auction',{inventoryId:x.u,startingPrice:price,durationHours,idempotencyKey:key});if(!r?.result?.id)throw new Error('Сервер не создал лот');delete S.pendingListings[x.u];save();closeM();U.auctions=null;await connectGameServer();await new Promise(resolve=>setTimeout(resolve,250));U.auctions=null;drawLots();toast('Лот выставлен на общий аукцион');}catch(err){toast(err?.message||'Не удалось выставить лот')}}

async function serverCreateOrder(){
 const category=$('#ocategory')?.value||'Все',minRarity=Number($('#orarity')?.value||0),offeredPrice=Math.floor(Number($('#ooffer')?.value));
 if(!Number.isSafeInteger(offeredPrice)||offeredPrice<100)return toast('Укажи цену от 100 TC');
 if(!S.pendingOrders||typeof S.pendingOrders!=='object')S.pendingOrders={};
 const key=category+':'+minRarity+':'+offeredPrice;
 const idempotencyKey=S.pendingOrders[key]||uid();S.pendingOrders[key]=idempotencyKey;save();
 try{const r=await window.feServerRequest('create_market_order',{category,minRarity,offeredPrice,idempotencyKey});if(!r?.result?.id)throw new Error('Сервер не создал заявку');delete S.pendingOrders[key];S.bal=Number(r.result.balance)||S.bal;save();U.orders=null;closeM();await connectGameServer();toast('Заявка создана, TC зарезервированы');render()}catch(err){toast(err?.message||'Не удалось создать заявку')}
}

 const key=S.pendingFills[orderId]||uid();S.pendingFills[orderId]=key;save();
 try{const r=await window.feServerRequest('fulfill_market_order',{orderId,inventoryId,idempotencyKey:key});if(!r?.result)throw new Error('Сервер не подтвердил сделку');delete S.pendingFills[orderId];S.bal=Number(r.result.balance)||S.bal;save();U.orders=null;closeM();await connectGameServer();toast('Предмет продан за '+fmt(r.result.price));render()}catch(err){toast(err?.message||'Не удалось выполнить заявку')}
}

 const rows=U.storeItems.map(x=>({x,it:byId(x.code)})).filter(z=>z.it&&matchF(z.it)&&(U.mr<0||z.it.rar===U.mr)&&(z.it.name+' '+z.it.brand+' '+z.it.type).toLowerCase().includes((U.mq||'').toLowerCase())).sort((a,b)=>U.so==='pa'?a.x.sale_price-b.x.sale_price:U.so==='rar'?b.it.rar-a.it.rar||b.x.sale_price-a.x.sale_price:U.so==='nw'?b.it.n-a.it.n:b.x.sale_price-a.x.sale_price);
 e.innerHTML=rows.length?'<div class=\'list\'>'+rows.map(z=>`<div class='rw m${z.it.rar}' style='--rc:${RAR[z.it.rar].c}' data-act='serverShopBuy' data-id='${z.x.code}'>${th(z.it)}<div class='grow'><b>${esc(z.it.name)}</b><div class='rt'>${RAR[z.it.rar].n}</div><div class='mut'>Оценка ${fmt(z.x.price)}</div><div class='big gold'>${fmt(z.x.sale_price)}</div></div><button class='btn sm'>Купить</button></div>`).join('')+'</div>':'<div class=\'card mut\'>По этим фильтрам ничего нет.</div>';return}
 if(U.mt===1){if(!Array.isArray(U.auctions)||Date.now()-(U.auctionsAt||0)>10000){e.innerHTML='<div class=\'card mut\'>Обновляем реальные ставки…</div>';if(!U.auctionsLoading){U.auctionsLoading=true;window.feServerRequest('list_auctions').then(r=>{U.auctions=r.auctions||[];U.auctionsAt=Date.now();U.auctionsLoading=false;drawLots()}).catch(err=>{U.auctionsLoading=false;e.innerHTML='<div class=\'card mut\'>Ошибка аукциона: '+esc(err.message)+'</div>'})}return}
 const rows=U.auctions.filter(a=>(!U.as||a.is_mine||a.is_leading)&&(!U.as||true)).map(a=>({a,it:byId(a.code)})).filter(z=>z.it&&matchF(z.it)&&(U.mr<0||z.it.rar===U.mr)&&(z.it.name+' '+z.it.brand+' '+z.it.type+' '+z.a.seller_name).toLowerCase().includes((U.mq||'').toLowerCase())).sort((a,b)=>U.so==='pa'?a.a.current_bid-b.a.current_bid:U.so==='rar'?b.it.rar-a.it.rar||b.a.current_bid-a.a.current_bid:U.so==='nw'?new Date(b.a.created_at)-new Date(a.a.created_at):b.a.current_bid-a.a.current_bid);
 e.innerHTML=rows.length?'<div class=\'list\'>'+rows.map(z=>row({...z.it,price:z.a.current_bid},`<button class='btn sm'>${z.a.is_mine?'Мой лот':z.a.is_leading?'Вы лидер':'Ставка'}</button>`,`${esc(z.a.seller_name)} · ${z.a.bid_count} ставок · ещё ${left(new Date(z.a.ends_at).getTime())}`,z.a.id,'serverLot')).join('')+'</div>':'<div class=\'card mut\'>Активных лотов по этим фильтрам нет.</div>';return}
 if(U.mt===2){if(!Array.isArray(U.orders)||Date.now()-(U.ordersAt||0)>10000){e.innerHTML='<div class=\'card mut\'>Обновляем заявки…</div>';if(!U.ordersLoading){U.ordersLoading=true;window.feServerRequest('list_buy_orders').then(r=>{U.orders=r.orders||[];U.ordersAt=Date.now();U.ordersLoading=false;drawLots()}).catch(err=>{U.ordersLoading=false;e.innerHTML='<div class=\'card mut\'>Ошибка загрузки заявок: '+esc(err.message)+'</div>'})}return}
 const rows=U.orders.map(o=>`<div class='rw' data-act='serverOrder' data-id='${o.id}'><div class='grow'><b>${esc(o.buyer_name)} ${o.is_mine?'· Твоя заявка':''}</b><div class='mut'>${esc(o.category)} · ${RAR[o.min_rarity].n}+ · до ${new Date(o.expires_at).toLocaleString('ru-RU')}</div></div><b class='gold'>${fmt(o.offered_price)} TC</b><button class='btn sm'>${o.is_mine?'Управлять':'Продать'}</button></div>`).join('');

function ensureClanSeason(){
 if(!S.clan)return;
 const season=Math.floor(Date.now()/(7*864e5));
 if(!Number.isFinite(S.clan.warSeason))S.clan.warSeason=season;
 if(S.clan.warSeason!==season){
  S.clan.warHistory=Array.isArray(S.clan.warHistory)?S.clan.warHistory:[];
  S.clan.warHistory.unshift({season:S.clan.warSeason,score:Number(S.clan.warScore)||0,ended:Date.now()});
  S.clan.warHistory=S.clan.warHistory.slice(0,12);
  S.clan.warSeason=season;S.clan.warScore=0;save();
 }
}

async function roll(){
 if(busy)return;
 let req=S.pendingRoll;
 if(!req){req={idempotencyKey:uid(),count:MULTS[S.mi],category:S.cat,minRarity:S.minR};S.pendingRoll=req;save();}
 busy=1;
 try{
  const response=await window.feServerRequest('roll_items',{count:req.count,idempotencyKey:req.idempotencyKey,category:req.category,minRarity:req.minRarity});
  const data=response?.result;
  if(!data||!Array.isArray(data.items)||data.items.length!==req.count)throw new Error('Сервер вернул неполный результат броска');
  const n=req.count;
  const items=data.items.map(x=>({u:String(x.inventory_id),id:String(x.code),server:true}));
  S.bal=Number(data.balance)||0;
  S.inv.push(...items);
  S.st.rolls+=n;
  S.xp+=5*n;
  items.forEach(x=>S.drops.unshift({t:Date.now(),id:x.id}));
  S.drops=S.drops.slice(0,50);
  S.last=items[items.length-1];
  if(n>1){const best=items.slice().sort((a,b)=>byId(b.id).price-byId(a.id).price)[0];S.last=best;}
  S.pendingRoll=null;save();
  connectGameServer();
  const best=items.map(x=>byId(x.id)).sort((a,b)=>b.rar-a.rar||b.price-a.price)[0];
  boxAnim(RAR[best.rar].c,()=>{S.pop=n===1;render();if(n>1)results(items)});
 }catch(err){busy=0;toast(err?.message||'Не удалось выполнить бросок');}
}
async function equipServerItem(x){try{const r=await window.feServerRequest('equip_item',{inventoryId:x.u,equipped:!x.equipped});if(!r?.result)throw new Error('Сервер не подтвердил экипировку');await connectGameServer();const updated=S.inv.find(i=>i.u===x.u);toast(updated?.equipped?'Предмет надет на образ':'Предмет снят с образа');inst(x.u)}catch(err){toast(err?.message||'Не удалось изменить образ')}}
async function sellServerItem(x){
 if(!S.pendingSales||typeof S.pendingSales!=='object')S.pendingSales={};
 const key=S.pendingSales[x.u]||uid();
 S.pendingSales[x.u]=key;save();
 try{
  const response=await window.feServerRequest('sell_item',{inventoryId:x.u,idempotencyKey:key});
  const data=response?.result;
  if(!data||!Number.isFinite(Number(data.balance))||!Number.isFinite(Number(data.proceeds)))throw new Error('Сервер вернул неполный ответ продажи');
  S.inv=S.inv.filter(i=>i.u!==x.u);
  S.bal=Number(data.balance);
  S.st.sold++;
  log('sell','Продажа: '+(byId(x.id)?.name||data.name),Number(data.proceeds));
  if(S.last?.u===x.u)S.last=null;
  delete S.pendingSales[x.u];
  save();connectGameServer();closeM();toast('Продано за '+fmt(data.proceeds));render();
 }catch(err){toast(err?.message||'Не удалось продать предмет');}
}

// Подключение профиля к Supabase. Локальный прогресс пока не перезаписываем:
// сначала проверяем авторизацию и наличие серверного профиля/кошелька.
async function connectGameServer(){
  try{
    const state=await window.feServerRequest('get_state');
    if(!state||state.ok!==true||!state.player||!state.wallet)throw new Error('Сервер вернул неполные данные');
    if(Array.isArray(state.inventory)){
      const legacyInventory=(S.inv||[]).filter(x=>x&&x.server!==true);
      const serverInventory=state.inventory.map(x=>({u:String(x.inventory_id),id:String(x.code),server:true,equipped:x.is_equipped===true}));
      S.inv=[...legacyInventory,...serverInventory];
    }
    window.FE_SERVER_STATE=state;
    window.FE_IS_ADMIN=state.isAdmin===true;
    $('#nav').innerHTML=TABS.filter(t=>t[0]!=='admin'||window.FE_IS_ADMIN).map(t=>`<button data-tab="${t[0]}"><b>${t[2]}</b>${t[1]}</button>`).join('');
    S.bal=Number(state.wallet.balance)||0;
    if(state.progress&&Number.isFinite(Number(state.progress.xp)))S.xp=Number(state.progress.xp);
    U.refSummary=state.referralSummary||null;
    if(state.daily){S.streak=Number(state.daily.streak)||0;S.daily=String(state.daily.date||'');}
    if(state.taskProgress){S.st.rolls=Number(state.taskProgress.rolls)||0;S.st.sold=Number(state.taskProgress.sold)||0;}
    const claimedTasks=state.taskClaims||{};['roll_5','roll_25','sell_3'].forEach((k,i)=>{S.claimed['t'+i]=!!claimedTasks[k];});
    if(state.clan){S.clan={...(S.clan||{}),id:state.clan.id,name:state.clan.name,capacity:Number(state.clan.capacity)||25,treasury:Number(state.clan.treasury)||0,warScore:Number(state.clan.season_contribution)||0,role:state.clan.role,members:Array.isArray(state.clan.members)?state.clan.members:[{name:tgUser?.first_name||'Участник',role:state.clan.role}]};}else{S.clan=null;}
    save();renderTop();if(tab==='clan')render();
    console.info('[FASHION EMPIRE] Supabase connected', {playerId:state.player.id,balance:state.wallet.balance});
    toast(state.referral?.status==='rewarded'&&!state.referral?.duplicate?'Реферальный бонус начислен: +20 000 TC':'Связь с сервером установлена');
    return true;
  }catch(error){
    window.FE_SERVER_STATE={ok:false,error:String(error?.message||error)};
    console.warn('[FASHION EMPIRE] Supabase connection failed:',error);
    toast('Сервер пока недоступен: '+String(error?.message||error));
    return false;
  }
}
